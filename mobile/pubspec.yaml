name: nashidpril
description: Islamic Audio Platform - Nasheeds & Quran

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.1.4

  # HTTP & networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Auth
  google_sign_in: ^6.2.1

  # Storage
  flutter_secure_storage: ^9.0.0

  # Audio player
  just_audio: ^0.9.39
  just_audio_background: ^0.0.1-beta.13
  audio_session: ^0.1.21

  # Images
  cached_network_image: ^3.3.1

  # File picker
  file_picker: ^8.0.0+1
  image_picker: ^1.1.2

  # UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  fluttertoast: ^8.2.6
  lottie: ^3.1.2

  # Utils
  intl: ^0.19.0
  timeago: ^3.7.0
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
